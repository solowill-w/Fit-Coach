.fsel>i[class^=ui-]:first-child{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--accent-dark);pointer-events:none;}
.fsel .fsel-ch{display:none !important;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;opacity:.5;pointer-events:none;}
.tx-filters select{width:100%;-webkit-appearance:none;appearance:none;padding:11px 26px 11px 34px;font-size:12.5px !important;font-weight:600;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;}
/* Tarjetas de cuenta: la etiqueta ya no se sale ni pisa los botones */
.entity-card .acc-head{padding-right:80px;}
.entity-card .acc-meta .tag{display:block;width:fit-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;}
/* Filtros de Transacciones: botones redondos solo con ícono */
.tx-filters{display:flex;gap:10px;align-items:flex-start;}
.tx-filters .fsel{position:relative;width:auto;}
.tx-filters .isel{position:relative;}
.tx-filters .isel-btn{width:50px;height:50px;padding:0;gap:0;justify-content:center;border-radius:50%;background:var(--card-bg);border:1px solid var(--card-border);}
.tx-filters .isel-btn .isel-tx,.tx-filters .isel-btn .ui-down{display:none;}
.tx-filters .isel-btn .isel-ic{width:30px;height:30px;}
.tx-filters .isel-btn .cat-badge.nb{background:transparent !important;}
.tx-filters .isel.is-active .isel-btn{border:2px solid var(--accent);background:var(--accent-soft);}
.tx-filters .isel-list{position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:max-content;min-width:230px;max-width:calc(100vw - 36px);max-height:300px;box-shadow:0 14px 34px -10px rgba(20,40,35,.28);}
.tx-filters .isel-opt .isel-tx{white-space:nowrap;}
/* Yo: íconos de copia de seguridad y restaurar más cuidados */
.yo-ico-btn{background:var(--accent-soft) !important;border:1px solid color-mix(in srgb,var(--accent) 24%,transparent) !important;height:60px !important;border-radius:20px !important;transition:transform .15s ease,border-color .15s ease;}
.yo-ico-btn:hover{border-color:var(--accent) !important;transform:translateY(-1px);}
.yo-ico-btn:active{transform:scale(.97);}
.yo-ico-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.yo-ico-btn svg .soft{fill:var(--card-bg);}
.bk-icons{display:flex;gap:6px;align-items:center;}
#view-ajustes .yo-ico-btn{flex:none !important;width:42px;height:42px !important;padding:0 !important;background:transparent !important;border:none !important;box-shadow:none !important;border-radius:50% !important;color:var(--accent-dark);display:inline-flex;align-items:center;justify-content:center;}
#view-ajustes .yo-ico-btn:hover{transform:none;}
#view-ajustes .yo-ico-btn svg{width:26px;height:26px;}
/* Yo: recuadro de copia/restaurar bien bajito y fin de página justo tras Cerrar sesión */
#yoBody .card:has(.yo-ico-btn){padding:7px 8px !important;border-radius:18px !important;}
#yoBody .yo-ico-btn{height:34px !important;min-height:0 !important;border-radius:12px !important;}
#yoBody .yo-ico-btn svg{width:18px;height:18px;}
body[data-view=yo] .content{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px)) !important;}
body[data-view=yo] .yo-logout{margin-bottom:0 !important;}
/* secciones abiertas desde Yo: sin menú inferior */
@media(max-width:900px){
  body.from-yo .bnav,body.from-yo .fab{display:none !important;}
  body.from-yo .content{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)) !important;}
}
/* Yo: solo los iconos, sin recuadros */
#yoBody .card:has(.yo-ico-btn){background:transparent !important;border:none !important;box-shadow:none !important;padding:0 !important;}
#yoBody .card:has(.yo-ico-btn)>div{justify-content:center;gap:34px !important;}
#yoBody .yo-ico-btn{flex:none !important;width:44px;height:44px !important;background:transparent !important;border:none !important;box-shadow:none !important;border-radius:50% !important;}
#yoBody .yo-ico-btn:hover{transform:none;}
#yoBody .yo-ico-btn svg{width:26px;height:26px;}
/* Transacciones: iconos perfectamente centrados en su círculo/recuadro */
.tx-head .cat-badge,.tx-filters .isel-btn,.tx-filters .isel-opt .cat-badge{display:flex !important;align-items:center;justify-content:center;line-height:0;padding:0;}
.tx-head .cat-badge svg,.tx-head .cat-badge i,.tx-filters .cat-badge svg,.tx-filters .cat-badge i{display:block !important;margin:0 !important;vertical-align:baseline !important;flex:none;position:static;}
.tx-head .cat-badge svg{width:56%;height:56%;}
.tx-head .cat-badge i[class^=ui-]{width:58%;height:58%;}
.tx-filters .isel-btn .isel-ic{display:flex;align-items:center;justify-content:center;margin:0;}
.tx-filters .isel-btn .cat-badge{margin:0;}
.ks-g{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);margin:0 0 16px;overflow:hidden}
.ks-r{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:60px;width:100%;background:none;border:0;border-bottom:1px solid var(--card-border);color:var(--text);font-family:var(--font-b);text-align:left;cursor:pointer}
.ks-g>.ks-r:last-child,.ks-it:last-child>.ks-r{border-bottom:0}
.ks-i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark)}
.ks-i.d{background:var(--accent);color:var(--on-accent,#fff)}.ks-i.y{background:#f2c553;color:#2b2208}.ks-i.r{background:#c4584a;color:#fff}.ks-i.g{background:var(--card-border);color:var(--text-muted)}
.ks-i svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ks-t{flex:1;min-width:0;font-size:15px;font-weight:600}.ks-t small{display:block;font-size:12.5px;font-weight:400;color:var(--text-muted);margin-top:2px;line-height:1.35}
.ks-v{color:var(--text-muted);font-size:14px;font-family:var(--font-n)}.ks-c{color:var(--text-muted);font-size:18px;transition:transform .15s}.ks-c.o{transform:rotate(90deg)}.ks-red .ks-t{color:#c4584a}
.ks-r .switch{background:var(--card-border);pointer-events:none}.ks-r .switch.on{background:var(--accent)}
.ks-prof{padding:16px}.ks-av{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent,#fff);display:grid;place-items:center;font-family:var(--font-d);font-size:24px;font-weight:700}
.ks-prof .ks-t{font-family:var(--font-d);font-size:19px;font-weight:700}
.ks-slot{padding:4px 16px 16px;border-bottom:1px solid var(--card-border)}.ks-it:last-child .ks-slot{border-bottom:0}
.ks-opt{display:block;width:100%;padding:13px 14px;margin-bottom:8px;border-radius:var(--radius-sm);border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);font-family:var(--font-b);font-size:15px;text-align:left}.ks-opt.sel{border-color:var(--accent);background:var(--accent-soft)}

.ks-av{background:transparent;color:var(--accent-dark);overflow:hidden;flex:none}.ks-av .ks-mk{width:100%;height:100%}.ks-av img{width:100%;height:100%;object-fit:cover;display:block}
.ks-av.big{width:104px;height:104px;margin:4px auto 16px}
.ks-note{text-align:center;color:var(--text-muted);margin:6px 0 24px;font-size:13px}
#ksLock{position:fixed;inset:0;z-index:99999;background:var(--sidebar-bg,#12302b);display:none;align-items:center;justify-content:center;color:#fff;font-family:var(--font-b);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-sizing:border-box}
#ksLock .ksl-box{width:100%;max-width:340px;padding:0 24px;display:flex;flex-direction:column;align-items:center;text-align:center;box-sizing:border-box}
#ksLock .ksl-logo{width:76px;height:auto;margin-bottom:14px}
#ksLock .ksl-t{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:.2px}
#ksLock .ksl-s{margin-top:6px;font-size:14.5px;color:rgba(255,255,255,.66);min-height:20px}
#ksLock .ksl-dots{display:flex;gap:16px;margin:26px 0 8px;height:14px}
#ksLock .ksl-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);box-sizing:border-box;transition:background .12s,transform .12s}
#ksLock .ksl-dots i.on{background:var(--accent);transform:scale(1.08)}
#ksLock .ksl-dots.err{animation:kslShake .35s}
@keyframes kslShake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#ksLock .ksl-msg{height:20px;font-size:13px;color:#ff9a93;margin-bottom:10px}
#ksLock .ksl-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
#ksLock .ksl-k{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:#fff;font-family:var(--font-d);font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0;transition:background .12s,transform .08s}
#ksLock .ksl-k:active{background:rgba(255,255,255,.2);transform:scale(.94)}
#ksLock .ksl-k.ksl-ic{background:none;color:var(--accent)}
#ksLock .ksl-k.ksl-ic:active{background:rgba(255,255,255,.1)}
#ksLock .ksl-k svg{width:30px;height:30px}
#ksLock .ksl-cancel{margin-top:18px;background:none;border:0;color:rgba(255,255,255,.7);font-size:15px;font-weight:600;padding:10px 16px}
#ksLock .ksl-main{margin-top:30px;padding:15px 30px;border-radius:30px;border:0;background:var(--accent);color:var(--on-accent,#0d1f1a);font-family:var(--font-b);font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
#ksLock .ksl-main svg{width:24px;height:24px}
@media (max-height:640px){#ksLock .ksl-logo{width:54px;margin-bottom:6px}#ksLock .ksl-k{width:64px;height:64px;font-size:24px}#ksLock .ksl-pad{grid-template-columns:repeat(3,64px);gap:10px 20px}#ksLock .ksl-dots{margin-top:16px}}

<style>
.dl-pick{display:flex;align-items:center;gap:6px;}
.dl-pick select{flex:1;min-width:0;height:46px;}
.dl-pick span{color:var(--text-muted);font-weight:700;}
.yo-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.yo-grid button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;padding:14px 6px 12px;border-radius:22px;background:var(--card-bg);border:1px solid var(--card-border);box-shadow:0 10px 20px -16px rgba(0,0,0,.4);font-weight:700;font-size:12.5px;text-align:center;line-height:1.15;}
.yo-grid .yo-ico{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:var(--accent-dark);background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent) 30%,var(--card-bg)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 24%,transparent),0 4px 10px -6px var(--accent);}
.yo-grid .yo-ico svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.yo-grid .yo-t{min-width:0;max-width:100%;overflow-wrap:anywhere;}
.yo-grid button:active{transform:scale(.97);}
</style>
<style>
.yo-grid button{box-shadow:none;}
.yo-grid .yo-ico{width:44px;height:44px;border-radius:14px;color:var(--accent-dark);background:var(--accent-soft);box-shadow:none;}
.yo-grid .yo-ico svg{width:24px;height:24px;}
[data-theme="dark"] .yo-grid .yo-ico{color:var(--accent);background:var(--accent-soft);}
.yo-grid button:hover{border-color:var(--accent);}
.yo-grid .yo-ico.img{width:64px;height:64px;border-radius:18px;padding:0;overflow:hidden;background:transparent;box-shadow:none;}
:root:not([data-theme="dark"]) .yo-grid .yo-ico.img img{filter:drop-shadow(0 2px 2.5px rgba(11,36,30,.26));}
.yo-grid .yo-ico.img img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;-webkit-user-drag:none;}
.back-link{min-height:36px;}
/* mascota: ánimo */
.pet-body{transform-box:fill-box;transform-origin:50% 100%;}
.fx{opacity:0;pointer-events:none;transition:opacity .25s;}
.pet-opt .fx{display:none;}
.fx *{transform-box:fill-box;transform-origin:center;}
body[data-pm=happy] .fx-happy,body[data-pm=love] .fx-love,body[data-pm=worried] .fx-worried,body[data-pm=sad] .fx-sad,body[data-pm=thinking] .fx-thinking,body[data-pm=surprised] .fx-surprised,body[data-pm=sleepy] .fx-sleepy{opacity:1;}
body[data-pm=happy] .pet-body{animation:pmJoy .62s ease-in-out infinite;}
body[data-pm=love] .pet-body{animation:pmLove 1.1s ease-in-out infinite;}
body[data-pm=worried] .pet-body{animation:pmShake .4s linear infinite;}
body[data-pm=sad] .pet-body{animation:pmSad 2.6s ease-in-out infinite;}
body[data-pm=thinking] .pet-body{animation:pmThink 2.2s ease-in-out infinite;}
body[data-pm=surprised] .pet-body{animation:pmPop .5s ease-out both;}
body[data-pm=sleepy] .pet-body{animation:pmSleep 4s ease-in-out infinite;}
body[data-pm=happy] .fxs{animation:fxTw .9s ease-in-out infinite;}
body[data-pm=happy] .fxs.b{animation-delay:.3s}body[data-pm=happy] .fxs.c{animation-delay:.6s}
body[data-pm=love] .fxh{animation:fxRise 1.6s ease-in infinite;}
body[data-pm=love] .fxh.b{animation-delay:.5s}body[data-pm=love] .fxh.c{animation-delay:1s}
body[data-pm=worried] .fxd{animation:fxSweat 1.1s ease-in infinite;}
body[data-pm=sad] .fxd{animation:fxTear 1.4s ease-in infinite;}
body[data-pm=sad] .fxd.b{animation-delay:.6s}
body[data-pm=thinking] .fxt,body[data-pm=surprised] .fxt{animation:fxBob 1s ease-in-out infinite;}
body[data-pm=sleepy] .fxt{animation:fxZ 2.4s ease-in-out infinite;}
body[data-pm=sleepy] .fxt.b{animation-delay:1.1s}
@keyframes pmJoy{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-9%) scale(.97,1.05)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes pmLove{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(-3deg)}}
@keyframes pmShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3%) rotate(-2deg)}75%{transform:translateX(3%) rotate(2deg)}}
@keyframes pmSad{0%,100%{transform:translateY(4%) rotate(-5deg) scale(.97)}50%{transform:translateY(6%) rotate(-3deg) scale(.96)}}
@keyframes pmThink{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pmPop{0%{transform:scale(1)}30%{transform:translateY(-12%) scale(.95,1.12)}60%{transform:scale(1.08,.94)}100%{transform:scale(1.04)}}
@keyframes pmSleep{0%,100%{transform:translateY(3%) rotate(7deg) scale(1,.97)}50%{transform:translateY(2%) rotate(7deg) scale(1,1.01)}}
@keyframes fxTw{0%,100%{transform:scale(.3) rotate(0);opacity:.4}50%{transform:scale(1.2) rotate(25deg);opacity:1}}
@keyframes fxRise{0%{transform:translateY(6px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-9px) scale(1.05);opacity:0}}
@keyframes fxSweat{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes fxTear{0%{transform:translateY(-3px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translateY(14px) scale(1);opacity:0}}
@keyframes fxBob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-3px) rotate(8deg)}}
@keyframes fxZ{0%{transform:translate(0,4px) scale(.6);opacity:0}40%{opacity:1}100%{transform:translate(3px,-5px) scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){.pet-body,.fx *{animation:none!important}}
</style>

/* ===== ROBINIX: sprites por ánimo ===== */
.kwrap{display:block;width:100%;height:100%;padding:7%;box-sizing:border-box;transform-origin:50% 100%;}
.kimg{display:block;width:100%;height:100%;background:var(--k-happy) center/contain no-repeat;}
body[data-pm=love] .kimg{background-image:var(--k-love);}
body[data-pm=sad] .kimg{background-image:var(--k-sad);}
body[data-pm=sleepy] .kimg{background-image:var(--k-sleepy);}
body[data-pm=worried] .kimg,body[data-pm=angry] .kimg,body[data-pm=surprised] .kimg{background-image:var(--k-angry);}
body[data-pm=angry] .pet-body{animation:pmShake .4s linear infinite;}
.pet-stage .kwrap{animation:petBreathe 3.6s ease-in-out infinite;}
.pet-stage.hop .kwrap{animation:petHop .6s ease;}
@media (prefers-reduced-motion:reduce){.pet-stage .kwrap{animation:none}}
.pet-grid{display:block;}
.pet-solo{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px;}
.pet-solo-img{width:116px;height:116px;border-radius:50%;background:var(--accent-soft);overflow:hidden;}
.mp-av .kwrap,.pet-avatar .kwrap{padding:6%;}

/* ===== Robinix flotante: esquina inferior derecha en todas las pantallas ===== */
#mascot{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));}
.mascot-btn{position:relative;width:88px;height:88px;border:none;border-radius:0;background:transparent;box-shadow:none;padding:0!important;overflow:visible!important;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28));-webkit-tap-highlight-color:transparent;}
.mascot-btn .kwrap{padding:0;}
.mascot-btn:active{transform:scale(.94);}
.mascot-panel{width:min(360px,calc(100vw - 32px));}
@media(max-width:900px){
  #mascot{right:10px;bottom:calc(14px + 62px + 6px + env(safe-area-inset-bottom));}
  .mascot-btn{width:76px;height:76px;}
  .mascot-panel{width:min(360px,calc(100vw - 20px));max-height:calc(100dvh - 260px);}
  #mascot.sheet{left:0;right:0;bottom:0;}
  #mascot.sheet .mascot-panel{position:fixed;left:0;right:0;bottom:var(--kb,0px);width:auto;max-width:none;height:min(540px,calc(var(--vvh,100dvh) - 90px));max-height:none;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom);}
  #mascot.sheet .mascot-btn,#mascot.sheet .mascot-bubble{display:none;}
  body.k-sheet::after{content:"";position:fixed;inset:0;background:rgba(10,20,17,.4);z-index:59;}
}
/* pestaña Chat: Robinix sube a la esquina superior derecha para no tapar el campo de escritura */
body[data-view=chat] #mascot{bottom:auto;top:calc(14px + env(safe-area-inset-top));right:16px;flex-direction:column-reverse;}
body[data-view=chat] .mascot-btn{width:60px;height:60px;}
@media(max-width:900px){ body[data-view=chat] #mascot{top:calc(72px + env(safe-area-inset-top));right:12px;} }

/* ===== tarjetas de confirmación del chat ===== */
.k-card{display:block;line-height:1.45;}
.k-head{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-dark);}
.k-amt{font-family:var(--font-d);font-weight:800;font-size:20px;margin:1px 0 2px;}
.k-row{font-size:12.5px;color:var(--text-muted);}
.k-note{font-size:12px;margin-top:4px;color:var(--text-muted);font-style:italic;}
.k-q{width:100%;font-size:12.5px;font-weight:700;margin-bottom:2px;}
.k-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.k-acts .mp-chip{background:var(--card-bg);}
.k-acts .mp-chip.k-go{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#0d1f1a);}
.mp-msg.bot i.ui-check{color:var(--accent-dark);}

</style>
<style id="kitty2-css">
/* mascota: estados de ánimo con la nueva imagen */
body[data-pm=sad] .kimg{filter:grayscale(.5) brightness(.96);}
body[data-pm=sleepy] .kimg{opacity:.8;filter:saturate(.7);}
body[data-pm=love] .kimg{filter:drop-shadow(0 0 7px rgba(255,92,138,.65));}
body[data-pm=angry] .kimg,body[data-pm=worried] .kimg{filter:saturate(1.35) hue-rotate(-10deg);}
/* consejos en Inicio */
.kape-card.adv-card{flex-wrap:wrap;row-gap:10px;align-items:center;}
.adv-card .kape-line{transition:opacity .2s ease;font-size:15px;}
.adv-tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent-dark);margin-left:6px;vertical-align:middle;}
.adv-tag[data-t=Alerta],.adv-tag[data-t=Ojo]{background:var(--danger-soft);color:var(--danger);}
.adv-row{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;}
.adv-row .mp-chip{display:inline-flex;align-items:center;gap:6px;}
.adv-row .mp-chip small{opacity:.6;font-weight:600;}
/* chat */
.chat-wrap .mp-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chat-wrap .mp-chips::-webkit-scrollbar{display:none;}
.chat-wrap .mp-chip{flex-shrink:0;white-space:nowrap;}
.c-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.c-sug .mp-chip{background:var(--card-bg);}
.typing{display:inline-flex;gap:4px;align-items:center;height:14px;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent-dark);opacity:.35;animation:cTyp 1s infinite ease-in-out;}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes cTyp{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-4px);opacity:1}}
.mp-msg.bot b{color:var(--accent-dark);}
@media(max-width:900px){
  html:has(body[data-view=chat]),body[data-view=chat]{overflow:hidden;overscroll-behavior:none;}
  body[data-view=chat] .content{padding:0 !important;}
  body[data-view=chat] #view-chat.active{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);display:flex;flex-direction:column;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:20;}
  body[data-view=chat].kb-open #view-chat.active{padding-bottom:8px;}
  body[data-view=chat] #view-chat .page-head{flex:none;margin-bottom:10px;}
  body[data-view=chat] .chat-wrap{flex:1 1 auto;min-height:0;height:auto !important;}
}
/* íconos de la sección Yo (máscaras que toman el color del tema) */
.yoi{display:block;width:30px;height:30px;background-color:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;}
.yo-grid .yo-ico.png{width:46px;height:46px;border-radius:0;background:transparent;box-shadow:none;}
.yo-grid .yo-ico.png .yoi{width:42px;height:42px;}
/* selector con íconos (cuenta, origen, destino y categoría) */
.isel{position:relative;}
.isel .isel-native{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;}
.isel-btn{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 12px;border-radius:14px;border:1px solid var(--card-border);background:var(--bg);color:var(--text);font-size:14px;text-align:left;}
.isel.open .isel-btn{outline:2px solid var(--accent);outline-offset:1px;}
.isel-btn .ui-down{margin-left:auto;opacity:.55;transition:transform .15s;}
.isel.open .isel-btn .ui-down{transform:rotate(180deg);}
.isel-ic{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;}
.isel-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.isel-list{display:none;margin-top:6px;max-height:236px;overflow-y:auto;overscroll-behavior:contain;padding:4px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg);}
.isel.open .isel-list{display:block;}
.isel-opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:14px;text-align:left;}
.isel-opt.sel{background:var(--accent-soft);font-weight:600;}
.isel .bank-logo{object-fit:contain;}
.isel .bank-ini{background:var(--accent-soft);color:var(--accent-dark);font-size:10px;}
/* Ajustes: bloque de colores desplegable */
.acc-toggle{width:100%;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;gap:10px;}
.acc-toggle[aria-expanded=false]{margin-bottom:0;}
.acc-toggle h3{margin:0;}
.acc-cur{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-muted);}
.acc-cur .sw-dot{width:16px;height:16px;border-radius:50%;display:inline-block;}
.acc-toggle .ui-down{flex:none;opacity:.6;transition:transform .15s;}
.acc-toggle[aria-expanded=true] .ui-down{transform:rotate(180deg);}
#colorsBody{margin-top:14px;}
/* Ajustes: ícono de la app (toma el color del tema) */
.appico-row{display:flex;align-items:center;gap:16px;}
.appico-prev{width:72px;height:72px;border-radius:18px;flex:none;box-shadow:0 1px 0 var(--card-border);}
.ent-field .bank-logo,.ob2-srow .bank-logo,.ob2-rowbtn .bank-logo,.acc-head .bank-logo{border:1px solid rgba(128,128,128,.22);box-sizing:border-box;}
/* ===== Robinix avisa: burbuja de la mascota (abajo, dentro de la app) ===== */
.mascot-bubble{background:var(--accent) !important;color:var(--on-accent,#0d1f1a) !important;border-color:transparent !important;font-weight:600;}
</style>
<style id="boot-css">

<style id="fix-onb-css">
.sp-icon{width:170px}
.ob2-pet{width:118px;height:118px}
#onboarding[data-step="0"] .ob2-pet{width:170px;height:170px}
@media (max-height:700px){.ob2-pet{width:94px;height:94px}#onboarding[data-step="0"] .ob2-pet{width:132px;height:132px}}
.ob2-inwrap{position:relative;width:100%}
.ob2-inwrap .ob2-input{padding-left:64px;padding-right:64px}
.ob2-unit{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;font-weight:600;pointer-events:none}
</style>
<style id="fc-v5">
/* ===== v5: opciones uniformes, resumen, perfil, carga y selector flotante ===== */
.ob2-list .ob2-opt{height:78px;min-height:78px;padding:0 16px}
.ob2-list .ob2-opt .ic svg{width:26px;height:26px}
.ob2-opt small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#onboarding[data-fc="14"] .ob2-scroll{justify-content:center}
#onboarding[data-fc="14"] .ob2-stage{margin-top:0}
#onboarding[data-fc="14"] .ob2-step{flex:none;padding:22px 0 12px}
#onboarding[data-fc="14"] .ob2-fixlist{background:var(--card-bg);border:1px solid var(--card-border);border-radius:24px;padding:22px 20px;margin-top:6px;box-shadow:var(--shadow)}
.fs-hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.fs-hero .fc-pill{margin-top:10px}
.fs-stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:16px;padding-top:14px;border-top:1px solid var(--card-border)}
.fs-stats>div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:0 4px}
.fs-stats>div+div{border-left:1px solid var(--card-border)}
.fs-stats b{font:700 15px var(--font-n);white-space:nowrap}
.fs-stats span{font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.fc-macros .fc-m{justify-content:flex-start}
.fs-adj{text-align:center}
.fs-adjt{font:600 13px var(--font-b);color:var(--text-muted);margin-bottom:12px}
.fs-step{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px}
.fs-step button{height:52px;border-radius:16px;border:1.5px solid var(--card-border);background:var(--bg);color:var(--text);font:600 26px var(--font-n);line-height:1;padding:0}
.fs-step button:active{transform:scale(.95)}
.fs-step div{display:flex;flex-direction:column;align-items:center;gap:2px}
.fs-step b{font:800 30px var(--font-n);letter-spacing:-.5px}
.fs-step span{font-size:12px;color:var(--text-muted)}
.fs-adj .ob2-link.inl{margin-top:10px;font-size:13px}
.fs-note{text-align:center;margin:6px 4px 4px}
.fp-card{padding:16px 18px 6px}
.fp-id{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--card-border)}
.fp-av{width:46px;height:46px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font:700 19px var(--font-d)}
[data-theme="dark"] .fp-av{color:var(--accent)}
.fp-nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fp-nm b{font:700 17px var(--font-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-nm span{font-size:13px;color:var(--text-muted)}
.fp-ed{border:1.5px solid var(--card-border);background:transparent;color:var(--text);border-radius:12px;padding:8px 14px;font:600 13px var(--font-b)}
.fp-card .fc-kv b{text-align:right;max-width:62%}
.fp-note{text-align:center}
.fp-col summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 0;font:500 14px var(--font-b);cursor:pointer}
.fp-col summary::-webkit-details-marker{display:none}
.fp-col summary span{color:var(--text-muted)}
.fp-cur{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px var(--card-border)}
.fp-col .fc-sw{padding:2px 0 14px;flex-wrap:wrap;justify-content:center;gap:12px}
.fp-col[open] summary{padding-bottom:10px}
.fp-col .fc-sw button{animation:fpPop .25s ease both}
@keyframes fpPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.fp-del{display:block;margin:6px auto 0;border:none;background:none;color:var(--danger);font:600 13px var(--font-b);padding:10px}
.fc-sheet.fc-mid{left:50%;top:50%;bottom:auto;width:min(420px,calc(100% - 32px));max-height:min(640px,86dvh);border-radius:26px;padding:20px 18px 18px;box-shadow:0 24px 70px rgba(0,0,0,.4);opacity:0;transform:translate(-50%,-46%) scale(.96);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}

<style id="fc-v6">
/* ===== v6: apariencia (cuadro de colores + modo sol/luna) y capa de animaciones ===== */
.fp-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--card-border);background:none;color:var(--text);font:500 14px var(--font-b);text-align:left}
.fp-row>span:first-child{color:var(--text-muted)}
.fp-cv{display:flex;align-items:center;gap:10px;color:var(--text-muted)}
.fp-cv em{font-style:normal;font-weight:600;color:var(--text)}
.fp-cv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.fp-row:active .fp-cv svg{transform:translateX(4px)}
.fp-cur-pill{width:54px;height:24px;border-radius:999px;box-shadow:0 0 0 1px var(--card-border)}
.fp-mrow{align-items:center}
.fp-mode{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;width:92px;height:44px;padding:3px;border-radius:999px;background:var(--bg);border:1.5px solid var(--card-border);flex:none}
.fp-thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);border-radius:999px;background:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.22);transition:transform .42s cubic-bezier(.34,1.5,.5,1),background .3s}
.fp-mode[data-m="dark"] .fp-thumb{transform:translateX(100%)}
.fp-mode button{position:relative;z-index:1;display:grid;place-items:center;border:none;background:none;padding:0;border-radius:999px;color:var(--text-muted);transition:color .3s,transform .15s}
.fp-mode button:active{transform:scale(.88)}
.fp-mode[data-m="light"] button[data-m="light"],.fp-mode[data-m="dark"] button[data-m="dark"]{color:var(--on-accent,#0d1f1a)}
.fp-mode svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible;pointer-events:none}
.fp-mode .rays{transform-box:view-box;transform-origin:12px 12px}
.fp-mode[data-m="light"] button[data-m="light"] .rays{animation:fcSpin .65s cubic-bezier(.34,1.4,.5,1)}

.fc-sheet.fc-mid.fp-dlg{display:flex;flex-direction:column;height:min(640px,84dvh);overflow:hidden}
.fp-dh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.fp-dh h3{margin:0}
.fp-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:6px 6px 10px;margin:0 -6px}
.fp-dlg>.fc-btn{flex:none;margin-top:12px}
.fp-pill{flex:none;display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;padding:0 9px 0 22px;border:none;border-radius:999px;color:#f3f7f6;font:700 15px var(--font-b);text-align:left;transition:transform .2s,box-shadow .25s;animation:fcPopIn .5s cubic-bezier(.34,1.4,.5,1) backwards;animation-delay:calc(var(--i,0)*35ms + 180ms)}
.fp-pill b{font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.fp-pill .ck{width:34px;height:34px;border-radius:50%;background:rgba(6,20,27,.78);color:#fff;display:grid;place-items:center;transform:scale(0);opacity:0;transition:transform .4s cubic-bezier(.34,1.7,.5,1),opacity .2s}
.fp-pill .ck svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fp-pill.on{box-shadow:0 0 0 2px var(--card-bg),0 0 0 4px var(--text)}
.fp-pill.on .ck{transform:scale(1);opacity:1}
.fp-pill:active{transform:scale(.97)}

/* --- animaciones --- */
@keyframes fcPopIn{from{opacity:0;transform:translateX(-18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fcKid{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fcRow{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes fcTile{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes fcNavIn{from{opacity:0;transform:translate(-50%,46px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fcIcon{0%{transform:scale(.6) rotate(-14deg)}60%{transform:scale(1.22) rotate(6deg)}100%{transform:none}}
@keyframes fcPulse{0%{box-shadow:0 10px 30px rgba(10,25,22,.28),0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%,100%{box-shadow:0 10px 30px rgba(10,25,22,.28),0 0 0 16px transparent}}
@keyframes fcFlame{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.14,1.2) rotate(-5deg)}60%{transform:scale(.96,1.05) rotate(4deg)}}
@keyframes fcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fcRpl{from{transform:scale(0);opacity:.32}to{transform:scale(1);opacity:0}}
@keyframes fcSpin{from{transform:rotate(-100deg) scale(.5)}to{transform:none}}
@keyframes fcRock{0%{transform:rotate(-50deg) scale(.6)}60%{transform:rotate(12deg) scale(1.12)}100%{transform:none}}
@keyframes fcDot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes fcSel{0%{transform:scale(.96)}60%{transform:scale(1.025)}100%{transform:none}}
@keyframes fcDrop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* entrada de cada pantalla */
.fc:not(.fc-still) .fc-m{animation:fcTile .55s cubic-bezier(.34,1.3,.5,1) backwards;animation-delay:calc(var(--r,0)*70ms + 120ms)}
.fc:not(.fc-still) .fc-row,.fc:not(.fc-still) .fc-kv,.fc:not(.fc-still) .fx-ac .ac,.fc:not(.fc-still) .fx-rs button{animation:fcRow .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--r,0)*45ms + 180ms)}
.fc:not(.fc-still) .fx-sl button{animation:fcTile .45s cubic-bezier(.34,1.3,.5,1) backwards;animation-delay:calc(var(--r,0)*30ms + 150ms)}
.fc:not(.fc-still) .fx-g3>*{animation:fcTile .6s cubic-bezier(.34,1.3,.5,1) backwards;animation-delay:.15s}
.fc:not(.fc-still) .fx-bar i,.fc:not(.fc-still) .fc-bar span{transform-origin:left center;animation:fcGrow 1s cubic-bezier(.2,.8,.2,1) .25s backwards}
.fc.fc-boot .fc-nav{animation:fcNavIn .65s cubic-bezier(.34,1.3,.5,1) .2s backwards}
.fc:not(.fc-still) .fc-bn.on svg{animation:fcIcon .5s cubic-bezier(.2,.8,.2,1)}
.fc-fab{animation:fcPulse 3.6s ease-out 1.6s infinite}
.fc-fab svg{transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
.fc-fab:active svg{transform:rotate(90deg) scale(.9)}
.fc-streak svg{transform-origin:50% 90%;animation:fcFlame 2.6s ease-in-out infinite}
.fc-logo{transition:transform .4s cubic-bezier(.34,1.5,.5,1)}.fc-logo:active{transform:rotate(-8deg) scale(1.1)}
.fc-card,.fc-m,.fc-pillnav,.fc-det{transition:background-color .35s,border-color .35s,box-shadow .3s}
/* toque */
.fc-bn,.fx-tabs button,.fx-chips button,.fx-sl button,.fx-mini,.fp-ed,.fx-ck,.fx-rs button,.fx-ac .h{transition:transform .16s,background .2s,color .2s,border-color .2s}
.fc-bn:active,.fx-tabs button:active,.fx-chips button:active,.fx-sl button:active,.fx-mini:active,.fp-ed:active,.fx-ck:active,.fx-rs button:active,.fx-ac .h:active{transform:scale(.94)}
.fc-btn,.fc-bn,.fc-fab,.fx-mini,.fp-ed,.fx-tabs button,.fx-chips button,.fx-sl button,.fp-pill,.fp-row{position:relative;overflow:hidden}
.fc-rpl{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:fcRpl .65s ease-out forwards}
@media (hover:hover){.fc-btn:hover{filter:brightness(1.07)}.fp-pill:hover{transform:translateX(3px)}.fc-bn:hover,.fx-tabs button:hover,.fx-chips button:hover{transform:translateY(-1px)}}
/* campos */
.fc-f input,.fc-f select,.fx-ta,.fx-it input,.fx-set input{transition:border-color .2s,box-shadow .25s}
.fc-f input:focus,.fc-f select:focus,.fx-ta:focus,.fx-it input:focus,.fx-set input:focus{box-shadow:0 0 0 4px var(--accent-soft)}
/* hojas, desplegables y avisos */
.fc-sheet.on>*{animation:fcKid .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*45ms + 140ms)}
.fc-sheet>*:nth-child(2){--k:1}.fc-sheet>*:nth-child(3){--k:2}.fc-sheet>*:nth-child(4){--k:3}.fc-sheet>*:nth-child(5){--k:4}.fc-sheet>*:nth-child(6){--k:5}.fc-sheet>*:nth-child(7){--k:6}.fc-sheet>*:nth-child(8){--k:7}
.fc-det[open]>*:not(summary),.fx-ac .b{animation:fcDrop .35s cubic-bezier(.2,.8,.2,1) backwards}
.fc-toast{transition:opacity .3s,transform .45s cubic-bezier(.34,1.56,.5,1)}
.fc-sheet-bg{transition:opacity .3s}
/* onboarding */
.ob2-opt,.ob2-day{transition:transform .16s,background .2s,border-color .2s,box-shadow .2s}
.ob2-opt:active,.ob2-day:active{transform:scale(.97)}
.ob2-opt.sel,.ob2-day.sel{animation:fcSel .38s cubic-bezier(.34,1.5,.5,1)}
/* cambio de color / modo: fundido suave (no pisa transiciones propias) */

@media (prefers-reduced-motion:reduce){
  .fc *,.fc-sheet *,.fc-fab,.fp-pill,.fp-thumb,.fp-mode *,.ob2-opt,.ob2-day{animation:none!important}
  .fc-rpl{display:none}
  .fp-thumb,.fp-pill .ck{transition:none}
}

.fc-ring i svg{transform:none}

<style id="fc-v7">

.fp-aav{width:46px;height:46px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center}

.fp-atx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fp-atx b{font:700 16px var(--font-d)}
.fp-atx small{font-size:12.5px;color:var(--text-muted);line-height:1.35}
.fp-ach{width:18px;height:18px;flex:none;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.fp-acct:active .fp-ach{transform:translateX(4px)}
.fp-acct:active{transform:scale(.985)}

<script>
(function(){
  var doc=document, root=doc.documentElement, MIN=2200, MAX=15000, revealed=false, prevAnim, hasPrev=false;
  var splash=doc.getElementById('splash');
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function race(p,ms){ return Promise.race([p,wait(ms)]); }
  function frames(n){ return new Promise(function(r){ (function f(){ if(n--<=0) return r(); requestAnimationFrame(f); })(); }); }
  function domReady(){ return new Promise(function(r){ if(doc.readyState==='loading') doc.addEventListener('DOMContentLoaded',r); else r(); }); }
  function loaded(){ return new Promise(function(r){ if(doc.readyState==='complete') r(); else window.addEventListener('load',r); }); }
  function fontsReady(list){
    if(!doc.fonts||!doc.fonts.load) return Promise.resolve();
    return Promise.all(list.map(function(f){ return doc.fonts.load(f,'Aa0\u20b2\u00e1\u00f1').catch(function(){}); })).then(function(){ return doc.fonts.ready; }).catch(function(){});
  }
  function introReady(){
    var img=doc.querySelector('.sp-icon');
    var tint=new Promise(function(r){ var n=0; (function c(){ if(!img||img.style.visibility!=='hidden'||n++>70) return r(); setTimeout(c,30); })(); });
    return tint.then(function(){ return Promise.all([ img&&img.decode?img.decode().catch(function(){}):0, race(fontsReady(['600 19px "Bricolage Grotesque"']),2500) ]); });
  }
  function boot(){
    var src=doc.getElementById('appMain'); if(!src) return;
    try{ if(window.Chart&&Chart.defaults){ prevAnim=Chart.defaults.animation; hasPrev=true; Chart.defaults.animation=false; } }catch(e){}
    try{ var sc=doc.createElement('script'); sc.text=src.textContent; doc.body.appendChild(sc); }catch(e){ console.error(e); }
    src.remove();
    /* las animaciones que dependen de la app (cambio de pantalla, cuadros) se activan cuando la app ya existe */
    Array.prototype.slice.call(doc.querySelectorAll('script[data-late]')).forEach(function(l){
      try{ var s2=doc.createElement('script'); s2.text=l.textContent; doc.body.appendChild(s2); }catch(e){ console.error(e); }
      l.remove();
    });
  }
  function reveal(){
    if(revealed) return; revealed=true;
    try{ if(hasPrev) Chart.defaults.animation=prevAnim; }catch(e){}
    root.classList.remove('booting'); root.style.background='';
    if(!splash) return;
    splash.classList.add('out');
    setTimeout(function(){ try{ splash.remove(); }catch(e){} },700);
  }
  setTimeout(reveal,MAX);
  introReady().then(function(){
    if(splash) splash.classList.add('go');
    var t0=Date.now();
    return frames(2).then(function(){ return domReady(); }).then(function(){ return wait(80); }).then(boot).then(function(){
      return Promise.all([ race(loaded(),7000), race(fontsReady(['500 15px "Bricolage Grotesque"','600 15px "Bricolage Grotesque"','700 15px "Bricolage Grotesque"','800 15px "Bricolage Grotesque"','400 15px "Instrument Sans"','500 15px "Instrument Sans"','600 15px "Instrument Sans"','700 15px "Instrument Sans"']),4000) ]);
    }).then(function(){ return frames(3); }).then(function(){ return wait(Math.max(0,MIN-(Date.now()-t0))); });
  }).catch(function(e){ console.error(e); }).then(reveal);
})();
</script>

function isDark(){if(!S.mode)S.mode=S.dark?'dark':'light';return S.mode==='dark'||(S.mode==='auto'&&!!(MQ&&MQ.matches));}
function applyTheme(){
  const A=S.settings.accent,B=S.settings.base,r=document.documentElement,st=r.style,dark=isDark();
  S.dark=dark;
  {const _sg=dark+'|'+A;if(window.__thSig&&window.__thSig!==_sg&&!fcRM()){r.classList.add('fc-theming');clearTimeout(window.__thT);window.__thT=setTimeout(()=>r.classList.remove('fc-theming'),520);}window.__thSig=_sg;}
  r.setAttribute('data-theme',dark?'dark':'light');
  ACERO_KEYS.forEach(p=>st.removeProperty(p));
  let bar=B;
  if(String(A).toLowerCase()===ACERO_A){
    const v=ACERO[dark?'dark':'light'];for(const k in v)st.setProperty(k,v[k]);bar=v['--bg'];
  }else{
    st.setProperty('--accent',A);st.setProperty('--accent-dark',mix(A,'#000000',.25));
    st.setProperty('--accent-soft',mix(A,dark?B:'#ffffff',dark?.72:.86));
    st.setProperty('--hero-1',mix(B,A,.22));st.setProperty('--hero-2',mix(B,'#000000',.4));
    ['--bg','--card-bg','--card-border'].forEach(p=>dark?0:st.removeProperty(p));
    if(dark){st.setProperty('--bg',mix(B,'#000000',.6));st.setProperty('--card-bg',mix(B,'#000000',.32));st.setProperty('--card-border',mix(B,'#ffffff',.1));}
  }
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',bar);
}

function fcFx(root,still){

    root.querySelectorAll('.fc-big').forEach(el=>{const n=el.firstChild;if(!n||n.nodeType!==3)return;const raw=n.nodeValue,m=raw.trim();if(!/^\d{1,6}$/.test(m))return;const to=+m,t0=performance.now(),D=900;(function f(t){const k=Math.min(1,Math.max(0,(t-t0)/D)),e=1-Math.pow(1-k,3);n.nodeValue=raw.replace(m,String(Math.round(to*e)));if(k<1)requestAnimationFrame(f);})(t0);});
  }catch(e){}
}

    h+='<div class="fc-main"><div><div class="fc-big">'+W[W.length-1].kg+'<small> kg</small></div><span class="fc-pill">'+(diff>0?'+':'')+diff+' kg desde el inicio</span></div></div><svg viewBox="-8 -8 '+(w+16)+' '+(hh+16)+'" style="width:100%;margin-top:14px"><polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2.5"/>').join('')+'</svg><div class="fx-ax"><span>'+fdate(L[0].d)+'</span><span>'+fdate(L[L.length-1].d)+'</span></div>';

function calcPlan(p,o){

async function pdfLines(file){
  await pdfLoad();const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let n=1;n<=doc.numPages;n++){const tc=await(await doc.getPage(n)).getTextContent(),rows=[];

function pdfBuild(lines){
  const slots=((S.plan&&S.plan.meals)||[]).map(m=>m.n),pick=n=>slots.find(z=>nz(z).slice(0,4)===nz(n).slice(0,4))||n;
  const days=[],miss=[];let cur=null,slot=null;const newDay=()=>{cur={meals:{},names:{},k:{}};days.push(cur);};
  const cut=t=>{const m=t.match(/\s[-–]\s|:/);return m?t.slice(m.index+m[0].length):'';};
  const hd=t=>nz(t).replace(/^[\s•\-–*·]+/,'').split(/\s[-–]\s|:/)[0].trim();
  lines.forEach(raw=>{
    let rest=raw;const t0=nz(raw).replace(/^[\s•\-–*·]+/,'');
    if(PD_STOP.test(t0)&&!(PD_DAY.test(t0)&&t0.length<25)){slot=null;return;}
    const h1=hd(raw),dm=h1.length<25&&h1.match(PD_DAY);
    if(dm){newDay();slot=null;rest=cut(raw);}
    const t=nz(rest),lead=(t.match(/^[\s•\-–*·]+/)||[''])[0].length,sm=t.slice(lead).match(PD_SLOT);
    if(sm){const key=sm[1].replace(/[- ]/g,'')==='postentreno'?'Post-entreno':PD_SN[sm[1]];slot=pick(key);if(!cur)newDay();rest=rest.slice(lead+sm[0].length);}
    if(!slot)return;if(!cur)newDay();
    if(/^\s*(\d{1,2}\.\d{3}|\d{3,4})\s*$/.test(rest)){cur.k[slot]=+rest.replace('.','');return;}
    const km=rest.match(/\.\s+(\d{1,2}\.\d{3}|\d{3,4})\s*$/);
    if(km){const v=+km[1].replace('.','');if(v>=150&&v<=3000){cur.k[slot]=v;rest=rest.slice(0,km.index+1);}}
    const bm=rest.trim().match(/^batido\s*(\d+)\s*[:\-–]?\s*/i);
    if(bm){cur.names[slot]='Batido '+bm[1];rest=rest.trim().slice(bm[0].length);}
    const im=nz(rest).match(/igual que el (batido|desayuno|almuerzo|cena)\s*(\d)?/);
    if(im){const key=im[1]+(im[2]?' '+im[2]:''),s2=Object.keys(cur.names).find(k=>nz(cur.names[k])===key)||Object.keys(cur.meals).find(k=>nz(k)===key);
      if(s2&&cur.meals[s2]){cur.meals[slot]=cur.meals[s2].map(x=>({...x}));cur.names[slot]=cur.names[slot]||cur.names[s2];if(!cur.k[slot]&&cur.k[s2])cur.k[slot]=cur.k[s2];}return;}
    rest.split(/,(?!\d)|[;+]|\.\s+/).forEach(fr=>{
      const crudo=/crudo/i.test(fr);
      const c=fr.replace(/\([^)]*\)/g,'').replace(/(\d+)\s*(cdas?|cucharadas?)\s*(de\s*)?pasta de man[ií]/gi,(m,n)=>n*16+' g de mani').replace(/(\d+)\s*rebanadas?\s*(de\s*)?/gi,(m,n)=>n*30+' g de ').replace(/[^,.;]*a gusto[^,.;]*/gi,'').trim();
      if(!c)return;const r=parseText(c);
      r.miss.forEach(m=>{if(/\d/.test(m)&&m.length>2)miss.push(m);});
      r.items.forEach(it=>{if(crudo&&typeof RAW!=='undefined'&&RAW[it.n])it.g=Math.round(it.g/RAW[it.n]);(cur.meals[slot]=cur.meals[slot]||[]).push(it);});
    });
  });
  const ok=days.filter(d=>Object.keys(d.meals).length);if(!ok.length)return{days:[],miss};
  const R=Math.round,full=WD.map((d,i)=>{const src=ok[i%ok.length];return{d,meals:Object.keys(src.meals).filter(n=>src.meals[n].length).map(n=>{
    const it=src.meals[n],t=it.reduce((a,x)=>({k:a.k+x.k*x.g/100,p:a.p+x.p*x.g/100,c:a.c+x.c*x.g/100,f:a.f+x.f*x.g/100}),{k:0,p:0,c:0,f:0}),pk=src.k[n],fx=pk&&t.k>0?pk/t.k:1,e=fx>.5&&fx<2.5?fx:1;
    return{n,plato:src.names[n]||it.map(x=>x.n).slice(0,3).join(', '),ing:it.map(x=>({n:x.n,g:x.g})),k:R(e===1&&!(pk&&fx>.5&&fx<2.5)?t.k:pk),p:R(t.p*e),c:R(t.c*e),f:R(t.f*e)};})};});
  return{days:full,found:ok.length,miss:[...new Set(miss)].slice(0,12)};}

function ensureS(){
  S.shop=S.shop||{};S.sup=S.sup||{};S.tr=S.tr||{};S.tr.sub=S.tr.sub||{};S.tr.logs=S.tr.logs||{};
  {const RN=s=>s==='Merienda / pre-entreno'?'Merienda':s;if(S.plan&&S.plan.meals)S.plan.meals.forEach(m=>{m.n=RN(m.n);});Object.keys(S.meals||{}).forEach(d=>(S.meals[d]||[]).forEach(m=>{if(m.slot)m.slot=RN(m.slot);}));if(S.diet&&S.diet.days)S.diet.days.forEach(d=>d.meals.forEach(m=>{m.n=RN(m.n);}));}
  S.settings=S.settings||{};
  const ok=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);
  if(!ok(S.settings.accent))S.settings.accent=DEF.settings.accent;if(!ok(S.settings.base))S.settings.base=DEF.settings.base;
  if(!S.settings.v2){S.settings.accent=DEF.settings.accent;S.settings.base=DEF.settings.base;S.settings.v2=1;save();}
  if(S.diet&&S.diet.days)S.diet.days.forEach(d=>{d.meals=d.meals.filter(m=>m.n!=='Media mañana');});
  if(S.onboarded&&S.profile&&S.plan&&S.plan.meals&&S.plan.meals.some(m=>m.n==='Media mañana')){try{recalc();}catch(e){}}
  if(S.onboarded&&!S.profile)S.onboarded=false;
  else if(S.onboarded&&(!S.plan||!S.targets)){try{recalc();}catch(e){S.onboarded=false;}}
}
const dsig=()=>JSON.stringify([S.targets.kcal,S.profile.diet,S.profile.allergies,S.profile.budget]);
/* copia de seguridad: exportar / importar */
function exportData(){
  const o=JSON.parse(JSON.stringify(S));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='fitcoach-'+tdk()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Copia exportada');}
const clean=v=>Array.isArray(v)?v.map(clean):v&&typeof v==='object'?Object.keys(v).reduce((o,k)=>(o[String(k).replace(/[<>"'`\\]/g,'')]=clean(v[k]),o),{}):typeof v==='string'?v.replace(/[<>"'`\\]/g,''):v;
function importData(i){
  const f=i.files&&i.files[0];i.value='';if(!f)return;
  if(f.size>5e6){toast('El archivo es demasiado grande');return;}
  const r=new FileReader();
  r.onload=()=>{try{
    const o=clean(JSON.parse(r.result)),p=o&&o.profile;
    if(!p||!Array.isArray(p.days)||!GOALS[p.goal]||!GYMS[p.gym]||!EXPS[p.exp]||!ACTS[p.act]||!(p.sex==='m'||p.sex==='f')||!['age','height','weight','dur'].every(k=>Number.isFinite(+p[k])))throw 0;
    if(!o.targets||!['kcal','p','c','f'].every(k=>Number.isFinite(+o.targets[k])))o.targets=null;
    if(!confirm('Esto reemplazará los datos actuales de este dispositivo. ¿Continuar?'))return;
    S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);
    S.ob=null;ob=null;S.onboarded=true;ensureS();recalc();save();view='home';STILL=false;sel=tdk();render();toast('Datos importados');
  }catch(e){toast('El archivo no es una copia válida de FitCoach');}};
  r.readAsText(f);}
/* detalles de móvil y de uso continuo */
let LT=tdk();
document.addEventListener('visibilitychange',()=>{if(document.hidden||LT===tdk())return;if(sel===LT)sel=tdk();LT=tdk();STILL=false;if(S.onboarded&&!ob)render();});
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.closest&&t.closest('.fc-sheet'))setTimeout(()=>t.scrollIntoView({block:'center',behavior:'smooth'}),320);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const k=[...document.querySelectorAll('.fc-sheet.on')].pop(),b=k&&k.querySelector('.fx-bk[data-bk]'),fn=b&&window[b.dataset.bk];if(typeof fn==='function')fn();else closeSheet();}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- gestos: deslizar hacia la derecha para volver, deslizar hacia abajo para cerrar cuadros ---------- */
function backAction(){
  const sh=[...document.querySelectorAll('.fc-sheet.on')].pop();
  if(sh){const b=sh.querySelector('.fx-bk[data-bk]'),fn=b&&window[b.dataset.bk];return typeof fn==='function'?()=>fn():closeSheet;}
  const ac=$('#acct.on');if(ac)return ac.querySelector('.ac-x[hidden]')?null:acctClose;
  const tp=$('#themePick.on');if(tp)return TP&&TP.from?tpCancel:null;
  if(ob||!S.onboarded){const b=$('#obBack');return ob&&b&&!b.classList.contains('hide')?obPrev:null;}
  if(view==='train'&&tt==='hoy'&&SS!=null&&SS!==todayWd())return()=>{SS=null;render();};
  while(NAVH.length&&NAVH[NAVH.length-1]===view)NAVH.pop();
  const to=NAVH.length?NAVH[NAVH.length-1]:(view!=='home'?'home':null);
  return to?()=>{NAVH.pop();view=to;STILL=false;render();window.scrollTo({top:0});}:null;
}
(function(){
  const H=document.createElement('div');H.id='swipeHint';H.textContent='\u2039';H.setAttribute('aria-hidden','true');document.body.appendChild(H);
  let g=null;
  const dlg=()=>{
    const sh=[...document.querySelectorAll('.fc-sheet.on')].pop();if(sh)return{el:sh,full:false,close:closeSheet};
    const ac=$('#acct.on');if(ac)return ac.querySelector('.ac-x[hidden]')?null:{el:ac,full:true,close:acctClose};
    const tp=$('#themePick.on');if(tp)return TP&&TP.from?{el:tp,full:true,close:tpCancel}:null;
    return null;
  };
  const hs=el=>{for(;el&&el!==document.body;el=el.parentElement){if(el.scrollWidth>el.clientWidth+2){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true;}}return false;};
  const bgEl=()=>document.querySelector('.fc-sheet-bg');
  function drag(dy){
    const el=g.d.el;
    if(!g.s){g.s=1;el.style.transition='none';const b=bgEl();if(b&&!g.d.full)b.style.transition='none';}
    el.style.transform=g.d.full?'translateY('+dy+'px)':el.classList.contains('fc-mid')?'translate(-50%,calc(-50% + '+dy+'px))':'translate(-50%,'+dy+'px)';
    const b=bgEl();if(b&&!g.d.full)b.style.opacity=Math.max(0,1-dy/Math.max(200,el.offsetHeight));
  }
  function finish(ok){
    const d=g.d,m=g.m,a=g.a;g=null;
    if(m==='h'){H.className='back';H.style.opacity=0;H.style.transform='translateX(-60px)';if(ok&&a)a();return;}
    if(m!=='v'||!d)return;
    const el=d.el,b=bgEl();
    if(d.full){
      el.style.transition='transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s ease';
      if(ok){el.style.transform='translateY(100%)';d.close();}
      else{el.style.transform='';setTimeout(()=>{el.style.transition='';},300);}
    }else{
      el.style.transition='';if(b){b.style.transition='';}
      if(ok)d.close();
      el.style.transform='';if(b)b.style.opacity='';
    }
  }
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){g=null;return;}
    const t=e.touches[0],tg=e.target;
    if(tg.closest&&tg.closest('input,textarea,select,[contenteditable="true"]')){g=null;return;}
    g={x:t.clientX,y:t.clientY,t:Date.now(),m:null,tg,d:null};
    const d=dlg();
    if(d){const r=d.el.getBoundingClientRect();if(t.clientY-r.top<=84&&d.el.scrollTop<=1)g.d=d;}
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!g||e.touches.length!==1)return;
    const t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
    if(!g.m){
      const ax=Math.abs(dx),ay=Math.abs(dy);if(ax<8&&ay<8)return;
      if(g.d&&dy>0&&ay>ax*1.2)g.m='v';
      else if(dx>0&&ax>ay*1.6&&(g.x<=24||!hs(g.tg))){const a=backAction();if(!a){g=null;return;}g.m='h';g.a=a;}
      else{g=null;return;}
    }
    if(e.cancelable)e.preventDefault();
    if(g.m==='h'){const p=Math.min(1,Math.max(0,dx)/90);H.className='on';H.style.opacity=p;H.style.transform='translateX('+(-60+Math.min(dx,120)*.9)+'px) scale('+(.7+.3*p)+')';}
    else drag(Math.max(0,dy));
  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(!g||!g.m){g=null;return;}
    const t=e.changedTouches[0],dx=t.clientX-g.x,dy=t.clientY-g.y,dt=Math.max(1,Date.now()-g.t);
    finish(g.m==='h'?(dx>90||(dx>45&&dx/dt>.5)):(dy>110||(dy>50&&dy/dt>.6)));
  },{passive:true});
  document.addEventListener('touchcancel',()=>{if(g&&g.m)finish(false);else g=null;},{passive:true});
})();

ensureS();

render();
if(!S.themeSet)themePick(false);
if(!S.acctSeen)acctScreen(false);
</script>
